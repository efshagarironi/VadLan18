# NOTE: the Java sources below are stored gzip+base64 packed (GitHub rejects workflow files over 500 KB).
# To read/edit them: for each block "base64 -d <<'B64' | gunzip > FILE" decode the lines up to the B64 marker
# (python: gzip.decompress(base64.b64decode(''.join(lines)))); ">>" blocks are appended to the same file in order.
name: Build APK
on: [push, workflow_dispatch]
jobs:
 build:
  runs-on: ubuntu-24.04
  steps:
  - uses: actions/checkout@v4
  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17
  - uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: 8.7
  - name: Create project files
    run: |
     mkdir -p app/src/main/java/com/mylauncher app/src/main/res/drawable app/src/main/res/xml app/src/main/res/values app/src/main/res/mipmap-anydpi-v26 app/src/main/assets/fonts/fa app/src/main/assets/fonts/en

     dl() { curl -fsSL --retry 2 --max-time 90 -o "app/src/main/assets/fonts/$1" "$2" || rm -f "app/src/main/assets/fonts/$1"; }
     G=https://github.com/google/fonts/raw/main/ofl
     R=https://github.com/rastikerdar
     dl fa/Vazirmatn-VF.ttf "$G/vazirmatn/Vazirmatn%5Bwght%5D.ttf"
     dl fa/Sahel.ttf "$R/sahel-font/raw/master/dist/Sahel.ttf"
     dl fa/Shabnam.ttf "$R/shabnam-font/raw/master/dist/Shabnam.ttf"
     dl fa/Vazir.ttf "$R/vazir-font/raw/master/dist/Vazir.ttf"

     cat > settings.gradle <<'EOF'
     pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
     dependencyResolutionManagement { repositories { google(); mavenCentral() } }
     rootProject.name = "VadLan"
     include ':app'
     EOF

     cat > build.gradle <<'EOF'
     plugins { id 'com.android.application' version '8.5.2' apply false }
     EOF

     # fixed signing key: every build is signed with the same key, so a new APK installs over the old one
     echo "" | base64 -d > app/vadlan.jks

     cat > app/build.gradle <<'EOF'
     plugins { id 'com.android.application' }
     android {
         namespace 'com.mylauncher'
         compileSdk 34
         signingConfigs {
             vadlan {
                 storeFile file('vadlan.jks')
                 storePassword 'vadlan123'
                 keyAlias 'vadlan'
                 keyPassword 'vadlan123'
             }
         }
         defaultConfig {
             applicationId "com.vadlan"
             minSdk 26
             targetSdk 34
             // minutes since 1970: always bigger than the previous build, so Android never sees it as a downgrade
             versionCode System.currentTimeMillis().intdiv(60000L).intValue()
             versionName "57.0"
         }
         buildTypes {
             debug { signingConfig signingConfigs.vadlan }
             release { signingConfig signingConfigs.vadlan }
         }
     }
     tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
     EOF

     cat > app/src/main/AndroidManifest.xml <<'EOF'
     <?xml version="1.0" encoding="utf-8"?>
     <manifest xmlns:android="http://schemas.android.com/apk/res/android"
         xmlns:tools="http://schemas.android.com/tools">
         <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
         <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions" />
         <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
         <uses-permission android:name="android.permission.VIBRATE" />
         <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
         <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
         <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
         <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
         <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
         <queries>
             <intent>
                 <action android:name="android.intent.action.MAIN" />
                 <category android:name="android.intent.category.LAUNCHER" />
             </intent>
         </queries>
         <application
             android:label="VadLan"
             android:icon="@mipmap/ic_launcher"
             android:roundIcon="@mipmap/ic_launcher"
             android:supportsRtl="true"
             android:requestLegacyExternalStorage="true"
             android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
             <activity
                 android:name=".MainActivity"
                 android:exported="true"
                 android:windowSoftInputMode="adjustResize"
                 android:launchMode="singleTask">
                 <intent-filter>
                     <action android:name="android.intent.action.MAIN" />
                     <category android:name="android.intent.category.LAUNCHER" />
                     <category android:name="android.intent.category.HOME" />
                     <category android:name="android.intent.category.DEFAULT" />
                 </intent-filter>
             </activity>
             <activity
                 android:name=".ClipGrabActivity"
                 android:exported="false"
                 android:excludeFromRecents="true"
                 android:noHistory="true"
                 android:taskAffinity=""
                 android:theme="@android:style/Theme.Translucent.NoTitleBar" />
             <activity
                 android:name=".VaultImgActivity"
                 android:exported="false"
                 android:excludeFromRecents="true"
                 android:taskAffinity=""
                 android:theme="@android:style/Theme.Translucent.NoTitleBar" />
             <service
                 android:name=".VadTile"
                 android:enabled="false"
                 android:exported="true"
                 android:label="Vad"
                 android:icon="@drawable/ic_tile"
                 android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                 <intent-filter>
                     <action android:name="android.service.quicksettings.action.QS_TILE" />
                 </intent-filter>
             </service>
             <service
                 android:name=".TileClickService"
                 android:exported="true"
                 android:label="VadLan"
                 android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                 <intent-filter>
                     <action android:name="android.accessibilityservice.AccessibilityService" />
                 </intent-filter>
                 <meta-data
                     android:name="android.accessibilityservice"
                     android:resource="@xml/tile_a11y" />
             </service>
             <service
                 android:name=".MockBubbleService"
                 android:enabled="true"
                 android:exported="false"
                 android:foregroundServiceType="specialUse">
                 <property
                     android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                     android:value="floating_bubble" />
             </service>
         </application>
     </manifest>
     EOF

